<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lanzamientos Musicales Premium</title>

    <style>

        /* =========================
           CONFIGURACIÓN GENERAL
        ========================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            background-image: url('fondo.jpg');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;

            background-color: #0b0c10;

            color: #c5c6c7;
            font-family: 'Segoe UI', Arial, sans-serif;

            text-align: center;

            margin: 0;
            padding: 20px;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =========================
           CONTENEDOR PRINCIPAL
        ========================== */

        .contenedor {
            width: 100%;
            max-width: 560px;

            background: rgba(31, 40, 51, 0.96);

            padding: 35px;

            border-radius: 18px;

            border: 1px solid #45f3ff;

            box-shadow:
                0 0 20px rgba(69, 243, 255, 0.20),
                0 0 50px rgba(0, 0, 0, 0.50);

            position: relative;
        }


        /* =========================
           TÍTULO
        ========================== */

        h1 {
            color: #ffffff;

            font-size: 25px;

            line-height: 1.3;

            margin: 0 0 15px 0;
        }


        /* =========================
           TEXTO
        ========================== */

        p {
            color: #66fcf1;

            font-size: 16px;

            line-height: 1.6;

            margin: 0;
        }


        /* =========================
           BOTÓN
        ========================== */

        .boton {
            display: inline-block;

            background-color: #66fcf1;

            color: #0b0c10;

            padding: 13px 32px;

            text-decoration: none;

            font-weight: bold;

            border-radius: 30px;

            margin-top: 25px;

            transition:
                transform 0.25s ease,
                background-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .boton:hover {
            background-color: #45f3ff;

            transform: scale(1.05);

            box-shadow:
                0 0 15px rgba(102, 252, 241, 0.6);
        }


        /* =========================
           ESPACIO PUBLICITARIO
        ========================== */

        .anuncio-espacio {
            margin-top: 30px;

            padding: 20px 15px;

            min-height: 90px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #0b0c10;

            border-radius: 8px;

            color: #45ea55;

            font-size: 12px;
        }

        .anuncio-espacio p {
            color: #555;

            font-size: 12px;
        }


        /* =========================
           TABLETS
        ========================== */

        @media (max-width: 768px) {

            body {
                padding: 15px;

                background-attachment: scroll;
            }

            .contenedor {
                max-width: 520px;

                padding: 30px;
            }

            h1 {
                font-size: 23px;
            }
        }


        /* =========================
           CELULARES
        ========================== */

        @media (max-width: 600px) {

            body {
                padding: 15px;

                /*
                 Si tienes una imagen específica
                 para celulares, cambia esta línea:
                 */
                background-image: url('fondo-mobile.jpg');

                background-size: cover;

                background-position: center top;

                background-attachment: scroll;

                align-items: center;
            }

            .contenedor {
                width: 100%;

                padding: 25px 20px;

                border-radius: 15px;
            }

            h1 {
                font-size: 21px;

                line-height: 1.35;
            }

            p {
                font-size: 15px;
            }

            .boton {
                padding: 13px 28px;

                width: auto;

                max-width: 100%;
            }

            .anuncio-espacio {
                margin-top: 25px;

                min-height: 80px;
            }
        }


        /* =========================
           CELULARES PEQUEÑOS
        ========================== */

        @media (max-width: 400px) {

            body {
                padding: 10px;
            }

            .contenedor {
                padding: 22px 16px;
            }

            h1 {
                font-size: 19px;
            }

            p {
                font-size: 14px;
            }

            .boton {
                width: 100%;
            }
        }

    </style>
</head>


<body>

    <div class="contenedor">

        <h1>
            🎵 ¡Lo muevo de Tito Guzmán y su conjunto!
        </h1>

        <p>
            Estás a un paso de escuchar el nuevo tema promocional
            antes de su lanzamiento en Spotify.
        </p>

        <a
            href="TU_LINK_DE_TINYURL_AQUI"
            class="boton"
            target="_blank"
            rel="noopener noreferrer">
            Escuchar Ahora
        </a>


        <!-- =========================
             ESPACIO PUBLICITARIO
        ========================== -->

        <div class="anuncio-espacio">

            <p>
                [Espacio Publicitario / Anuncio Recomendado]
            </p>

        </div>

    </div>

</body>
</html>
