               <style>
        body { 
            background-image: url('fondo.jpg'); 
            background-size: contain; /* Ajusta la imagen completa para que no se corte */
            background-position: center top; /* Centra la imagen arriba */
            background-repeat: no-repeat; /* Evita que la foto se duplique */
            background-color: #0b0c10; /* Color de relleno negro por si la pantalla es más grande que la foto */
            color: #c5c6c7; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            text-align: center; 
            padding: 25px 10px; 
            margin: 0; 
        }
        .contenedor { 
            max-width: 420px; /* Tarjeta un poco más compacta */
            margin: 30px auto; 
            background-color: rgba(31, 40, 51, 0.75); /* Fondo oscuro con 75% de transparencia */
            backdrop-filter: blur(5px); /* Efecto de vidrio esmerilado muy estético */
            padding: 25px; 
            border-radius: 15px; 
            border: 1px solid rgba(69, 243, 255, 0.4); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        h1 { color: #fff; font-size: 20px; margin-bottom: 10px; }
        p { color: #66fcf1; font-size: 14px; line-height: 1.5; }
        .boton { 
            display: inline-block; 
            background-color: rgba(102, 253, 241, 0.2); /* Botón con fondo transparente (20% de color) */
            color: #66fcf1; /* Letras de color brillante para que se lea bien */
            border: 2px solid #66fcf1; /* Borde sólido que define el botón */
            padding: 8px 20px; /* Tamaño más pequeño y estilizado */
            text-decoration: none; 
            font-weight: bold; 
            font-size: 14px;
            border-radius: 20px; 
            margin-top: 15px; 
            transition: 0.3s;
        }
        .boton:hover {
            background-color: #66fcf1; /* Al pasar el dedo o el mouse, el botón se ilumina por completo */
            color: #0b0c10;
        }
        .anuncio-espacio { 
            margin-top: 25px; 
            padding: 12px; 
            background: rgba(11, 12, 16, 0.8); 
            border-radius: 8px; 
            color: #45ea55; 
            font-size: 11px; 
        }
    </style>
